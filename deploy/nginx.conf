# Plantilla nginx para servir el build estático (dist/).
# __API_ORIGIN__ y __ATTACHMENTS_ORIGIN__ (origen exacto del bucket S3 de adjuntos) se sustituyen en el despliegue (envsubst/sed) por el origen exacto del API, p. ej. https://api.normaia.pe
# Mantener alineado con deploy/securityHeaders.ts (lo verifica e2e/security-headers.spec.ts).

server_tokens off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1k;          # el front no recibe uploads

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Assets con hash: caché inmutable
    location /assets/ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: __ATTACHMENTS_ORIGIN__; font-src 'self'; connect-src 'self' __API_ORIGIN__ __ATTACHMENTS_ORIGIN__; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'none'; require-trusted-types-for 'script'; trusted-types 'none'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    # Bloquear ficheros ocultos y source maps por si llegaran al build
    location ~ /\.(?!well-known) { deny all; }
    location ~ \.map$ { deny all; }

    # SPA: el HTML nunca se cachea (para que las rotaciones de clave/CSP surtan efecto)
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: __ATTACHMENTS_ORIGIN__; font-src 'self'; connect-src 'self' __API_ORIGIN__ __ATTACHMENTS_ORIGIN__; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'none'; require-trusted-types-for 'script'; trusted-types 'none'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }
}
